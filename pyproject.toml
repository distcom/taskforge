[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskforge"
version = "1.0.0"
description = "High-performance task orchestration engine for AI agents — decompose complex work, coordinate plugins, enforce delivery verification, and resume from any point."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "TaskForge Contributors" }]
keywords = ["ai", "agent", "orchestration", "pipeline", "task-management", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.scripts]
taskforge = "taskforge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/taskforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
